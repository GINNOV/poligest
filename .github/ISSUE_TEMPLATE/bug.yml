name: Bug
description: Something in Sorriso, ScanID, or QuickNotes is wrong.
title: ""
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Giornata
        - Agenda
        - Pazienti
        - Richiami
        - Magazzino
        - Finanza
        - Medici
        - Admin
        - ScanID
        - QuickNotes
        - Deploy
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or screen
      placeholder: /pazienti/lista

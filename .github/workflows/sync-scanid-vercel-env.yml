name: Sync ScanID Vercel Env

on:
  push:
    branches: [main]
    paths:
      - app/src/lib/scanid-meta.ts
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Sync SCANID_* env vars to production
        working-directory: app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hdJx31hcSazKyledunhWeXfR
          VERCEL_PROJECT_ID: prj_jcEaR1ip0UKse7TUVhliSjJb5EKq
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not configured — skipping Vercel env sync."
            exit 0
          fi
          chmod +x scripts/sync-scanid-vercel-env.sh
          ./scripts/sync-scanid-vercel-env.sh

      - name: Redeploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_hdJx31hcSazKyledunhWeXfR
          VERCEL_PROJECT_ID: prj_jcEaR1ip0UKse7TUVhliSjJb5EKq
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN secret not configured — skipping redeploy."
            exit 0
          fi
          chmod +x app/scripts/redeploy-vercel-production.sh
          ./app/scripts/redeploy-vercel-production.sh